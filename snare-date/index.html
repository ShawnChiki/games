<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;800&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: icon rail down the left · full-bleed sound map · slide-over panel · place-card "now playing" bar at the bottom */
:root{
  /* Gala — red dress, black tie */
  --bg:#0a0607;
  --stage:radial-gradient(120% 85% at 60% 28%, #2b0b12 0%, #12070a 48%, #0a0607 78%);
  --frame-line:rgba(220,183,104,.22);
  --ink:#f3e9d6; --muted:#a8957f; --accent:#dcb768; --hot:#c8102e;
  --panel:#100809; --line:#3b2328; --field:#1a0e10; --opt-on:#1f0d11; --chip-bg:#1a0e10;
  --rail:#060304; --rail-ink:#8f7d69; --rail-on:#dcb768; --rail-on-bg:#1c0f12; --rail-on-line:transparent; --mono:#dcb768;
  --card:#f3e9d6; --card-ink:#1a0d0f; --card-muted:#7a5a3c; --card-line:#b8924a;
  --card-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 0 0 4px #f3e9d6, inset 0 0 0 5px rgba(184,146,74,.55);
  --btn:#c8102e; --btn-ink:#fff5ea; --btn-line:#c8102e; --btn-shadow:none; --btn-case:uppercase; --btn-track:.14em; --btn-size:12px;
  --ghost-ink:#f3e9d6; --ghost-line:#5a3d33;
  --veil:rgba(6,3,4,.72); --bar-bg:#e5d6b8;
  --radius:3px; --bw:1px;
  --font-display:"Bodoni Moda","Bodoni 72",Didot,"Times New Roman",Georgia,serif;
  --font-body:"Jost","Futura","Avenir Next","Segoe UI",system-ui,sans-serif;
  --title-style:italic; --title-weight:500; --label-track:.2em;
  color-scheme:dark;
}
:root[data-style="sean"]{
  /* Sean — bold playground primaries */
  --bg:#ffd400;
  --stage:radial-gradient(rgba(0,0,0,.10) 1.6px, transparent 1.9px) 0 0/22px 22px, #ffd400;
  --frame-line:transparent;
  --ink:#111111; --muted:#4d4100; --accent:#1530ff; --hot:#ff2a1a;
  --panel:#ffffff; --line:#111111; --field:#ffffff; --opt-on:#e6eaff; --chip-bg:#ffffff;
  --rail:#1530ff; --rail-ink:#ffffff; --rail-on:#111111; --rail-on-bg:#ffd400; --rail-on-line:#111111; --mono:#ffd400;
  --card:#ffffff; --card-ink:#111111; --card-muted:#1530ff; --card-line:#111111;
  --card-shadow:6px 6px 0 #111111;
  --btn:#ff2a1a; --btn-ink:#ffffff; --btn-line:#111111; --btn-shadow:3px 3px 0 #111111; --btn-case:none; --btn-track:0; --btn-size:15px;
  --ghost-ink:#111111; --ghost-line:#111111;
  --veil:rgba(255,212,0,.75); --bar-bg:#ffe680;
  --radius:12px; --bw:3px;
  --font-display:"Archivo Black","Arial Black",Impact,sans-serif;
  --font-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --title-style:normal; --title-weight:400; --label-track:.08em;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:auto minmax(0,1fr);height:100%}

/* rail */
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;padding-left:max(6px, env(safe-area-inset-left,0px));border-right:var(--bw) solid var(--line);z-index:5;overflow-y:auto}
.mono{font-family:var(--font-display);font-style:var(--title-style);font-size:26px;line-height:1;color:var(--mono);margin:2px 0 12px}
.tab{appearance:none;-webkit-appearance:none;width:44px;height:44px;border:var(--bw) solid transparent;border-radius:var(--radius);background:transparent;color:var(--rail-ink);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s;padding:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
:root[data-style="sean"] .tab svg{stroke-width:2.4}
.tab[aria-selected="true"]{background:var(--rail-on-bg);color:var(--rail-on);border-color:var(--rail-on-line)}
.tab:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible,select:focus-visible,.styleopt:focus-visible,.favplay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* stage */
.main{position:relative;overflow:hidden;background:var(--stage)}
.frame{position:absolute;inset:10px;border:1px solid var(--frame-line);pointer-events:none}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.head{position:absolute;top:18px;left:22px;right:70px;pointer-events:none;z-index:2}
.title{font-family:var(--font-display);font-style:var(--title-style);font-weight:var(--title-weight);font-size:clamp(21px,4.4vw,32px);line-height:1.05;margin:0;text-wrap:balance}
:root[data-style="sean"] .title{text-transform:uppercase;letter-spacing:-.01em}
.sub{font-size:11px;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums}
.fit{position:absolute;top:14px;right:14px;z-index:2}
.iconbtn{appearance:none;width:44px;height:44px;display:grid;place-items:center;border:var(--bw) solid var(--ghost-line);background:var(--panel);color:var(--ink);border-radius:var(--radius);cursor:pointer;padding:0;box-shadow:var(--btn-shadow)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ax{position:absolute;font-size:11px;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--muted);pointer-events:none;z-index:2;white-space:nowrap}
.ax-x{left:50%;bottom:96px;transform:translateX(-50%)}
.ax-y{left:14px;top:52%;transform-origin:left top;transform:rotate(-90deg) translateX(-50%)}
.legend{position:absolute;left:18px;right:18px;bottom:92px;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none;z-index:2;justify-content:center}
.legend .chip{font-size:11px;padding:3px 8px 3px 5px}

/* now playing card */
.now{position:absolute;left:14px;right:14px;bottom:14px;max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--card-line);border-radius:var(--radius);box-shadow:var(--card-shadow);z-index:3;min-height:66px}
.now-text{min-width:0;flex:1}
.kicker{font-size:10px;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--card-muted);font-weight:600}
.name{font-family:var(--font-display);font-style:var(--title-style);font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now.hint .name{font-family:var(--font-body);font-style:normal;font-size:15px}
#wave{width:96px;height:38px;flex:none}
.now.hint #wave,.now.hint .star{display:none}
.star{appearance:none;flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--card-ink);display:grid;place-items:center;cursor:pointer;padding:0}
.star svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linejoin:round}
.star[aria-pressed="true"] svg{fill:var(--hot);stroke:var(--hot)}

/* panel */
.panel{position:absolute;top:0;left:0;bottom:0;width:min(352px,calc(100% - 28px));background:var(--panel);border-right:var(--bw) solid var(--line);z-index:4;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 20px 32px;transform:translateX(-106%);transition:transform .26s cubic-bezier(.2,.8,.2,1);-webkit-user-select:text;user-select:text}
.panel.open{transform:none;box-shadow:14px 0 40px rgba(0,0,0,.3)}
.panel h2{font-family:var(--font-display);font-style:var(--title-style);font-weight:var(--title-weight);font-size:30px;margin:0 0 8px;line-height:1.08;text-wrap:balance}
:root[data-style="sean"] .panel h2{font-size:26px;text-transform:uppercase}
.lede{color:var(--muted);margin:0 0 20px;line-height:1.5;font-size:14px;max-width:34em}
.lede b{color:var(--ink);font-weight:600}
.note{color:var(--muted);margin:0;line-height:1.5;font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:var(--label-track);color:var(--muted);font-weight:600}
.btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:10px 16px;background:var(--btn);color:var(--btn-ink);border:var(--bw) solid var(--btn-line);border-radius:var(--radius);box-shadow:var(--btn-shadow);font-weight:600;font-size:var(--btn-size);cursor:pointer;text-align:center;letter-spacing:var(--btn-track);text-transform:var(--btn-case)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.ghost{background:transparent;color:var(--ghost-ink);border-color:var(--ghost-line)}
.btn:active,.iconbtn:active{transform:translate(1px,1px)}
.field{display:flex;flex-direction:column;gap:7px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:var(--bw) solid var(--ghost-line);border-radius:var(--radius);overflow:hidden}
.seg button{appearance:none;min-height:44px;border:0;background:transparent;cursor:pointer;font-weight:600}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
select{min-height:46px;padding:8px 12px;background:var(--field);border:var(--bw) solid var(--ghost-line);border-radius:var(--radius);color:var(--ink);width:100%}
.check{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-weight:500}
.check input{width:22px;height:22px;accent-color:var(--hot);flex:none;margin:0}
.opt{display:block;padding:14px;border:var(--bw) solid var(--ghost-line);border-radius:var(--radius);cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--opt-on)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt .t{font-weight:600;font-size:16px}
.opt .d{color:var(--muted);font-size:13px;line-height:1.45;margin-top:4px}
.opt .est{font-variant-numeric:tabular-nums;font-size:12px;margin-top:9px;color:var(--ink);letter-spacing:.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.scorebox{border:var(--bw) solid var(--accent);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--font-display);font-style:var(--title-style);font-size:58px;line-height:.9;font-weight:var(--title-weight);font-variant-numeric:tabular-nums;color:var(--hot)}
.score span{font-size:12px;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;font-size:12px;background:var(--chip-bg);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none;border:1px solid var(--line)}
.favlist{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-bottom:16px}
.favrow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.favplay{appearance:none;flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;border:0;background:transparent;cursor:pointer;text-align:left;padding:0 4px}
.favplay svg{width:16px;height:16px;fill:var(--hot);flex:none}
.favplay span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.favplay em{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:var(--label-track);text-transform:uppercase;margin-left:auto;flex:none}
.favrow .iconbtn{border:0;box-shadow:none;background:transparent}
.styleopt{appearance:none;display:flex;align-items:center;gap:14px;padding:12px;border:var(--bw) solid var(--ghost-line);border-radius:var(--radius);background:transparent;cursor:pointer;text-align:left;width:100%}
.styleopt[aria-pressed="true"]{border-color:var(--accent);background:var(--opt-on)}
.styleopt b{display:block;font-size:17px}
.styleopt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sw{width:64px;height:48px;border-radius:6px;flex:none;display:block}
.sw-gala{background:radial-gradient(circle at 30% 40%,#c8102e 0 7px,transparent 8px),radial-gradient(circle at 62% 62%,#e98b6d 0 6px,transparent 7px),radial-gradient(circle at 74% 30%,#dcb768 0 5px,transparent 6px),#0a0607;border:1px solid #b8924a}
.sw-sean{background:radial-gradient(circle at 30% 40%,#ff2a1a 0 6px,#111 6px 8px,transparent 8.5px),radial-gradient(circle at 64% 62%,#1530ff 0 6px,#111 6px 8px,transparent 8.5px),radial-gradient(circle at 76% 28%,#fff 0 5px,#111 5px 7px,transparent 7.5px),#ffd400;border:2px solid #111}
textarea.copyfallback{width:100%;min-height:120px;margin-top:10px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:8px;font:13px/1.4 var(--font-body)}

/* busy + toast */
.busy{position:absolute;inset:0;display:grid;place-items:center;background:var(--veil);z-index:6}
.busy .box{background:var(--card);color:var(--card-ink);padding:20px 22px;width:min(320px,86%);border:var(--bw) solid var(--card-line);border-radius:var(--radius);box-shadow:var(--card-shadow)}
.busy .msg{font-family:var(--font-display);font-style:var(--title-style);font-size:19px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bar-bg);margin-top:14px;overflow:hidden;border-radius:999px}
.bar i{display:block;height:100%;background:var(--hot);width:0;transition:width .1s}
.toast{position:fixed;left:50%;top:max(84px, calc(env(safe-area-inset-top,0px) + 70px));transform:translateX(-50%);background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--card-line);border-radius:var(--radius);padding:10px 16px;z-index:7;max-width:calc(100% - 32px);font-size:14px;box-shadow:var(--card-shadow);z-index:30}
.fit2{position:absolute;top:66px;right:14px;z-index:2}
.around-pill{position:absolute;left:22px;top:94px;z-index:2;display:flex;align-items:center;gap:6px;max-width:calc(100% - 100px);padding:4px 4px 4px 14px;background:var(--card);color:var(--card-ink);border:var(--bw) solid var(--card-line);border-radius:999px;font-size:13px;box-shadow:var(--btn-shadow)}
.around-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.around-pill button{appearance:none;width:32px;height:32px;border:0;background:transparent;color:inherit;display:grid;place-items:center;cursor:pointer;flex:none;border-radius:999px}
.around-pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:var(--stage);padding:max(24px, env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) max(24px, env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));overflow-y:auto}
.splash-in{width:min(440px,100%);display:flex;flex-direction:column;gap:14px;text-align:center;padding:36px 26px;border:1px solid var(--frame-line)}
:root[data-style="sean"] .splash-in{background:var(--panel);border:var(--bw) solid var(--line);border-radius:var(--radius);box-shadow:var(--card-shadow)}
.splash-mono{font-family:var(--font-display);font-style:var(--title-style);font-size:54px;line-height:1;color:var(--accent)}
.splash h1{font-family:var(--font-display);font-style:var(--title-style);font-weight:var(--title-weight);font-size:clamp(32px,9vw,46px);line-height:1.02;margin:0;text-wrap:balance}
:root[data-style="sean"] .splash h1{text-transform:uppercase}
.splash-lede{color:var(--muted);line-height:1.5;margin:0 0 10px;text-wrap:pretty}
.splash .btn{min-height:56px;font-size:calc(var(--btn-size) + 1px)}
.splash .link{color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;padding:4px}
.splash-note{font-size:11px;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.drop{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:var(--radius);z-index:5;display:grid;place-items:center;font-family:var(--font-display);font-style:var(--title-style);font-size:24px;background:var(--veil);pointer-events:none}
@media (max-width:420px){ #wave{width:64px} .name{font-size:18px} }
@media (prefers-reduced-motion:reduce){ .panel{transition:none} }
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="splash-in">
    <div class="splash-mono" aria-hidden="true">R</div>
    <div class="splash-note" style="margin:0">Reggie's Miracle Snare Date</div>
    <h1>Good evening Reggie 💋</h1>
    <p class="splash-lede">Every sound becomes a dot, and similar sounds sit together. Slide across them to find the one.</p>
    <label class="btn" for="spFolder"><svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg> Load your own folder</label>
    <input class="sr" type="file" id="spFolder" webkitdirectory multiple>
    <label class="link" for="spFiles">or choose files</label>
    <input class="sr" type="file" id="spFiles" multiple accept="audio/*,.wav,.wave,.aif,.aiff,.aifc,.mp3,.flac,.ogg,.m4a">
    <button class="btn ghost" id="spGen"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8"/><circle cx="15" cy="15" r=".8"/><circle cx="15" cy="9" r=".8"/><circle cx="9" cy="15" r=".8"/></svg> Generate 1,000 random drums</button>
    <p class="splash-note">Deep listening · Change it any time</p>
  </div>
</div>
<div class="app">
  <nav class="rail" aria-label="Panels">
    <div class="mono" aria-hidden="true">R</div>
    <button class="tab" data-tab="samples" aria-label="Samples" title="Samples" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg></button>
    <button class="tab" data-tab="map" aria-label="Map" title="Map" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="2"/><circle cx="9" cy="8" r="2"/><circle cx="15" cy="13" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="17" cy="19" r="1.2"/><circle cx="11" cy="18" r="1.2"/></svg></button>
    <button class="tab" data-tab="depth" aria-label="Listening depth" title="Listening depth" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M2 12h2.5l2-6 3 12 3-9 2 6 1.5-3H22"/></svg></button>

/* ---------------- random + filters ---------------- */

/* ---------------- blind-test hit synth ---------------- */

}
function peakOf(x){ let p = 0; for (let i = 0; i < x.length; i++){ const v = Math.abs(x[i]); if (v > p) p = v; } return p || 1; }

    const dx = s.tx - s.x, dy = s.ty - s.y;
    if (Math.abs(dx) > 2e-4 || Math.abs(dy) > 2e-4){ s.x += dx * .16; s.y += dy * .16; moving = true; }
    else { s.x = s.tx; s.y = s.ty; }
  }
  if (ripples.length) moving = true;
  if (moving || dirty){ draw(now); dirty = false; }
  requestAnimationFrame(frame);
}

/* ---------------- pointer input ---------------- */
const pointers = new Map(); let pinch = null, blocked = false;
const isNarrow = () => main.clientWidth < 700;
function localXY(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function hit(px, py, touch){
  const rr = Math.max(touch ? 26 : 16, dotR() * 1.6); let best = null, bd = rr * rr;
  for (const s of state.S){ const [X, Y] = scr(s), dx = X - px, dy = Y - py, d = dx * dx + dy * dy; if (d < bd){ bd = d; best = s; } }
  return best;
}
function audition(e){
  const [x, y] = localXY(e), h = hit(x, y, e.pointerType !== 'mouse');
  if (h !== lastHover){ lastHover = h; if (h) play(h); }
  if (h !== hover){ hover = h; dirty = true; }
}
cv.addEventListener('pointerdown', e => {
  unlock();
  if (state.tab && isNarrow()) setTab(null);
  try { cv.setPointerCapture(e.pointerId); } catch(err){}
  pointers.set(e.pointerId, localXY(e));
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, c:[(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s:view.s, ox:view.ox, oy:view.oy };
    blocked = true; hover = null; lastHover = null; dirty = true;
  } else if (pointers.size === 1 && !blocked){
    lastHover = null; audition(e);
  }
});
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, localXY(e));
  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const s = Math.min(14, Math.max(.6, pinch.s * d / pinch.d));
    const wx = (pinch.c[0] - pinch.ox) / pinch.s, wy = (pinch.c[1] - pinch.oy) / pinch.s;
    view.s = s; view.ox = c[0] - wx * s; view.oy = c[1] - wy * s; dirty = true; return;
  }
  if (blocked) return;
  if (e.pointerType === 'mouse' || pointers.has(e.pointerId)) audition(e);
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) blocked = false;
  if (e.pointerType !== 'mouse'){ lastHover = null; hover = null; dirty = true; }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse'){ lastHover = null; hover = null; dirty = true; } });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const [x, y] = localXY(e), f = Math.exp(-e.deltaY * .0015), s = Math.min(14, Math.max(.6, view.s * f)), k = s / view.s;
  view.ox = x - (x - view.ox) * k; view.oy = y - (y - view.oy) * k; view.s = s; dirty = true;
}, { passive:false });
$('#fit').addEventListener('click', resetView);

/* drag and drop */
let dragDepth = 0;
main.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('#drop').textContent = C().drop; $('#drop').hidden = false; });
main.addEventListener('dragover', e => e.preventDefault());
main.addEventListener('dragleave', () => { if (--dragDepth <= 0){ dragDepth = 0; $('#drop').hidden = true; } });
main.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; $('#drop').hidden = true;
  try { const list = await entriesToList(e.dataTransfer); await loadList(list); } catch(err){ toast('Those files could not be opened.'); }
});

/* ---------------- UI chrome ---------------- */
const nowEl = $('#now'), nbName = $('#nbName'), nbKicker = $('#nbKicker'), nbStar = $('#nbStar'), wave = $('#wave');
let nowSample = null;
const dispName = s => s.isTest ? `${C().guest} ${String(s.num).padStart(String(state.S.length).length, '0')}` : s.name;
const typeLabel = k => TYPES[typeIndex[k]][1];
function resetNow(){
  nowSample = null; nowEl.classList.add('hint');
  nbKicker.textContent = 'How to listen';
  nbName.textContent = matchMedia('(hover: hover)').matches ? 'Hover over the dots' : 'Slide a finger across the dots';
}
function setNow(s){
  nowSample = s; nowEl.classList.remove('hint');
  nbKicker.textContent = state.reveal && s.isTest ? typeLabel(s.type) : C().now;
  nbName.textContent = dispName(s);
  const on = state.faves.has(s.key);
  nbStar.setAttribute('aria-pressed', on); nbStar.setAttribute('aria-label', on ? C().removeFav : C().addFav);
  drawWave(s);
}
function drawWave(s){
  const w = wave.width, h = wave.height, c = wave.getContext('2d'), P = PAL[state.style], x = s.mono;
  c.clearRect(0, 0, w, h); c.fillStyle = P.waveBg; c.fillRect(0, h / 2 - .5, w, 1);
  const n = Math.min(x.length, Math.floor(s.sr * 1.5)), per = Math.max(1, Math.floor(n / w));
  c.fillStyle = P.wave;
  for (let i = 0; i < w; i++){
    let mx = 0; for (let j = i * per; j < Math.min(n, (i + 1) * per); j++){ const v = Math.abs(x[j]); if (v > mx) mx = v; }
    const hh = Math.max(1, mx * h * .92); c.fillRect(i, (h - hh) / 2, 1, hh);
  }
}
nbStar.addEventListener('click', () => {
  if (!nowSample) return;
  const k = nowSample.key;
  if (state.faves.has(k)) state.faves.delete(k); else state.faves.set(k, nowSample.path || dispName(nowSample));
  LS.set('faves', [...state.faves]); setNow(nowSample); dirty = true;
  if (state.tab === 'faves') renderPanel();
});
function setLabel(){ return state.isTest ? `${state.S.length.toLocaleString()} ${C().crowd}` : state.label; }
function updateHeader(){
  $('#sub').textContent = `${setLabel()} · ${DEPTHS[state.depth].label} listening` + (arranging() ? ' · arranging…' : '');
}
function updateAxisLabels(){
  const on = state.mode === 'axes', ax = $('#axXLabel'), ay = $('#axYLabel');
  ax.hidden = ay.hidden = !on;
  if (on){
    const A = AXES[state.axX], B = AXES[state.axY];
    ax.textContent = `${A.lo}  ←  ${A.label}  →  ${A.hi}`;
    ay.textContent = `${B.lo}  ←  ${B.label}  →  ${B.hi}`;
  }
}
function updateLegend(){
  const el = $('#legend'), on = state.reveal && state.isTest && !isNarrow();
  el.hidden = !on; dirty = true; if (!on) return;
  const P = PAL[state.style];
  el.innerHTML = TYPES.map(([k, l], i) => `<span class="chip"><i style="background:${P.types[i]}"></i>${l}</span>`).join('');
}
let busyOn = false;
function setBusy(msg, frac){ busyOn = true; $('#busy').hidden = false; $('#busyMsg').textContent = msg; $('#busyBar').style.width = Math.round(frac * 100) + '%'; }
function clearBusy(){ busyOn = false; $('#busy').hidden = true; }
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3800); }

/* ---------------- panels ---------------- */
const panel = $('#panel');
const ICON = {
  folder:'<svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>',
  files:'<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
  dice:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8"/><circle cx="15" cy="15" r=".8"/><circle cx="15" cy="9" r=".8"/><circle cx="9" cy="15" r=".8"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24"><path d="M4 7h3c5 0 5 10 10 10h3M4 17h3c2 0 3-1.5 4-3.5M13 9.5C14 8 15 7 17 7h3M17 4l3 3-3 3M17 14l3 3-3 3"/></svg>'
};
function fmtMs(ms){ if (ms == null) return '…'; return ms < 1 ? `${ms.toFixed(2)} ms` : ms < 10 ? `${ms.toFixed(1)} ms` : `${Math.round(ms)} ms`; }
function fmtTotal(ms){ const s = ms / 1000; return s < 1 ? `${s.toFixed(2)} s` : s < 60 ? `${s.toFixed(1)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`; }
const opts = (keys, sel) => keys.filter(axisOK).map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${AXES[k].label}</option>`).join('');

const PANELS = {
  samples(){
    return `<h2>${C().samples}</h2>
    <p class="lede">On the map now: <b>${esc(setLabel())}</b>.</p>
    <div class="stack">
      <label class="btn" for="inFolder">${ICON.folder} Choose a folder</label>
      <input class="sr" type="file" id="inFolder" webkitdirectory multiple>
      <label class="check"><input type="checkbox" id="subs" ${state.subs ? 'checked' : ''}> Include subfolders</label>
      <label class="btn ghost" for="inFiles">${ICON.files} Choose files</label>
      <input class="sr" type="file" id="inFiles" multiple accept="audio/*,.wav,.wave,.aif,.aiff,.aifc,.mp3,.flac,.ogg,.m4a">
      ${state.isTest ? '' : `<button class="btn ghost" data-act="deal">${ICON.dice} ${C().back}</button>`}
      <p class="note">WAV, AIFF, MP3 and FLAC all work. Your files stay on this device. On a computer you can also drop files or whole folders onto the map. On a phone, use Choose files.</p>
    </div>`;
  },
  map(){
    const sim = state.mode === 'sim', N = state.S.length, favN = state.S.filter(s => state.faves.has(s.key)).length;
    const around = state.mode === 'around';
    const aroundBody = `<p class="note">${around ? `The closer a dot sits to the middle, the more it resembles ${state.anchors.length === 1 ? 'your pick' : 'your picks'}. Rings mark the closest 10%, 25% and 50%. Directions keep the neighbourhoods from the cloud.` : 'Put one sound, or a set of favourites, in the middle and spread everything else out by how much it resembles them.'}</p>
      ${around && state.learned.length ? `<p class="note">Your picks agree most on <b>${state.learned.join(', ')}</b>, so those count extra.</p>` : ''}
      ${around && state.anchors.length >= 2 && !state.learned.length ? '<p class="note">Your picks are quite different from each other, so every quality counts the same.</p>' : ''}
      <button class="btn ghost" data-act="aroundNow" ${nowSample ? '' : 'disabled'}>Around the sound playing now</button>
      <button class="btn ghost" data-act="aroundFaves" ${favN ? '' : 'disabled'}>Around my ${C().faves.toLowerCase()} (${favN})</button>`;
    return `<h2>${C().map}</h2>
    <div class="stack">
      <div class="field"><span class="label">Arrange by</span>
        <div class="seg seg3"><button data-act="mode" data-v="sim" aria-pressed="${sim && !state.pendingAround}">Similarity</button><button data-act="mode" data-v="axes" aria-pressed="${state.mode === 'axes'}">Pick axes</button><button data-act="mode" data-v="around" aria-pressed="${around || !!state.pendingAround}">Around</button></div>
      </div>
      ${state.mode === 'around' || state.pendingAround ? aroundBody : sim ? `<p class="note">Sounds that measure alike sit together. Up, down, left and right have no fixed meaning in this view.${N > 2000 ? ' With over 2,000 sounds the map uses a faster, rougher layout.' : ''}</p>
        <button class="btn ghost" data-act="resettle" ${arranging() ? 'disabled' : ''}>${ICON.shuffle} ${arranging() ? 'Arranging…' : 'Re-run the arrangement'}</button>`
      : `<div class="field"><label class="label" for="axX">Across</label><select id="axX">${opts(Object.keys(AXES), state.axX)}</select></div>
         <div class="field"><label class="label" for="axY">Up</label><select id="axY">${opts(Object.keys(AXES), state.axY)}</select></div>`}
      <div class="field"><label class="label" for="colorBy">Dot colour</label>
        <select id="colorBy" ${state.reveal && state.isTest ? 'disabled' : ''}>${opts(Object.keys(AXES), state.colorBy)}<option value="none" ${state.colorBy === 'none' ? 'selected' : ''}>One colour</option></select>
        ${state.reveal && state.isTest ? '<span class="note">Recipes are revealed, so dots show their recipe colour.</span>' : ''}
      </div>
      <label class="check"><input type="checkbox" id="choke" ${state.choke ? 'checked' : ''}> Cut off the previous sound</label>
      <p class="note">Pinch or scroll to zoom. The corner button fits the map again.</p>
    </div>`;
  },
  depth(){
    const N = state.S.length;
    return `<h2>${C().depth}</h2>
    <p class="lede">How much of each sound to study. Deeper takes longer and can tell more sounds apart.</p>
    <div class="stack" role="radiogroup" aria-label="Listening depth">
      ${DEPTHS.map((d, i) => `<label class="opt"><input class="sr" type="radio" name="depth" value="${i}" ${i === state.depth ? 'checked' : ''}>
        <div class="t">${d.label}</div><div class="d">${d.desc}</div>
        <div class="est">${fmtMs(state.bench[i])} per sound · ${state.bench[i] == null ? '…' : fmtTotal(state.bench[i] * N)} for all ${N.toLocaleString()}</div></label>`).join('')}
      <p class="note">Times are measured on this device. Reading files from disk adds time on top.</p>
    </div>`;
  },
  test(){
    if (!state.isTest) return `<h2>${C().test}</h2>
      <p class="lede">The blind test uses synthesized drums and hits from ${TYPES.length} hidden recipes. Load them to see how well the map sorts sounds it has never heard.</p>
      <button class="btn" data-act="deal">${ICON.dice} ${C().back}</button>`;
    const sc = state.score, P = PAL[state.style];
    return `<h2>${C().test}</h2>
    <p class="lede">${state.S.length.toLocaleString()} drums and hits synthesized from ${TYPES.length} hidden recipes. About a third are layered with a second recipe, and many are pitched, crushed, distorted or drenched in reverb. The map only hears the audio. Reveal the recipes to see how well it sorted them.</p>
    <div class="stack">
      <label class="check"><input type="checkbox" id="reveal" ${state.reveal ? 'checked' : ''}> Reveal the recipes</label>
      ${state.reveal ? `<div class="scorebox">
          <div class="score"><b>${sc ? sc.pct + '%' : '…'}</b><span>${sc ? 'neighbour match' : 'still arranging'}</span></div>
          <p class="note">Of each sound's 5 nearest dots, this share came from the same recipe. Random seating scores about ${sc ? sc.base : 6}%. Layered sounds are labelled by their main recipe.</p>
          <p class="note">Switch between Quick and Deep listening, or try Pick axes, and watch the score move.</p>
        </div>
        <div class="chips">${TYPES.map(([k, l], i) => `<span class="chip"><i style="background:${P.types[i]}"></i>${l}</span>`).join('')}</div>` : ''}
      <div class="field"><span class="label">${C().many}</span>
        <div class="seg seg3">${[100, 300, 1000].map(v => `<button data-act="dealN" data-v="${v}" aria-pressed="${state.dealN === v}">${v.toLocaleString()}</button>`).join('')}</div></div>
      <button class="btn ghost" data-act="deal">${ICON.dice} ${C().deal}</button>
    </div>`;
  },
  faves(){
    const list = state.S.filter(s => state.faves.has(s.key));
    return `<h2>${C().faves}</h2>
    ${list.length ? `<div class="favlist">${list.map(s => `<div class="favrow">
        <button class="favplay" data-act="playkey" data-k="${esc(s.key)}">${ICON.play}<span>${esc(dispName(s))}</span>${state.reveal && s.isTest ? `<em>${typeLabel(s.type)}</em>` : ''}</button>
        <button class="iconbtn" data-act="unfav" data-k="${esc(s.key)}" aria-label="${C().removeFav}">${ICON.x}</button></div>`).join('')}</div>
      <button class="btn" data-act="aroundFaves">Arrange everything around these</button>
      <button class="btn ghost" data-act="copy">${ICON.copy} Copy the names</button><div id="copyOut"></div>`
    : `<p class="lede">${C().favesEmpty}</p>`}`;
  },
  style(){
    return `<h2>${C().style}</h2>
    <div class="stack">
      <button class="styleopt" data-act="style" data-v="gala" aria-pressed="${state.style === 'gala'}"><span class="sw sw-gala"></span><span><b>Gala</b><small>Red dress, black tie</small></span></button>
      <button class="styleopt" data-act="style" data-v="sean" aria-pressed="${state.style === 'sean'}"><span class="sw sw-sean"></span><span><b>Shawn</b><small>Bold playground colours</small></span></button>
    </div>`;
  }
};
function renderPanel(){
  const t = state.tab;
  panel.classList.toggle('open', !!t);
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  if (t) panel.innerHTML = PANELS[t]();
}
function setTab(t){ state.tab = state.tab === t ? null : t; renderPanel(); dirty = true; }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { unlock(); setTab(b.dataset.tab); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.tab) setTab(null); });

panel.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'mode'){
    const v = b.dataset.v;
    state.pendingAround = false;
    if (v === 'around'){
      if (state.anchors.length && state.S.some(s => state.anchors.includes(s.key))) arrangeAround(state.anchors);
      else if (nowSample) arrangeAround([nowSample.key]);
      else state.pendingAround = true;
    } else { state.mode = v; applyMode(); }
    renderPanel();
  }
  else if (act === 'resettle'){ rearrange(); renderPanel(); }
  else if (act === 'aroundNow'){ state.pendingAround = false; if (nowSample) arrangeAround([nowSample.key]); }
  else if (act === 'aroundFaves'){ state.pendingAround = false; arrangeAround(state.S.filter(s => state.faves.has(s.key)).map(s => s.key)); }
  else if (act === 'deal'){ await setSamples(await dealTest(state.dealN), true, ''); }
  else if (act === 'dealN'){ state.dealN = +b.dataset.v; LS.set('dealN', state.dealN); renderPanel(); }
  else if (act === 'playkey'){ unlock(); const s = state.S.find(x => x.key === b.dataset.k); if (s) play(s); }
  else if (act === 'unfav'){ state.faves.delete(b.dataset.k); LS.set('faves', [...state.faves]); if (nowSample) setNow(nowSample); dirty = true; renderPanel(); }
  else if (act === 'style'){ setStyle(b.dataset.v); }
  else if (act === 'copy'){
    const text = state.S.filter(s => state.faves.has(s.key)).map(s => (s.path || dispName(s)) + (state.reveal && s.isTest ? ` (${typeLabel(s.type)})` : '')).join('\n');
    try { await navigator.clipboard.writeText(text); toast('Copied.'); }
    catch(err){ $('#copyOut').innerHTML = `<textarea class="copyfallback" readonly>${esc(text)}</textarea>`; const ta = $('#copyOut textarea'); ta.focus(); ta.select(); toast('Select and copy the list below.'); }
  }
});
panel.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'inFolder' || t.id === 'inFiles'){
    const list = [...t.files].map(f => ({ file:f, path:f.webkitRelativePath || f.name }));
    t.value = '';
    if (list.length) await loadList(list);
  }
  else if (t.id === 'subs') state.subs = t.checked;
  else if (t.id === 'axX' || t.id === 'axY'){ state[t.id] = t.value; applyMode(); }
  else if (t.id === 'colorBy'){ state.colorBy = t.value; recolor(); }
  else if (t.id === 'choke'){ state.choke = t.checked; LS.set('choke', state.choke); }
  else if (t.name === 'depth'){ state.depth = +t.value; LS.set('depthV2', state.depth); await reanalyze(); }
  else if (t.id === 'reveal'){
    state.reveal = t.checked; state.score = arranging() ? null : computeScore();
    recolor(); renderPanel(); if (nowSample) setNow(nowSample);
  }
});

function setStyle(st){
  state.style = st; LS.set('style', st);
  document.documentElement.dataset.style = st;
  recolor(); renderPanel(); updateHeader();
  if (nowSample) setNow(nowSample); else resetNow();
}

/* ---------------- boot ---------------- */
document.documentElement.dataset.style = state.style;
resize(); resetNow();
requestAnimationFrame(frame);
function rearrange(){ if (state.mode !== 'sim') return; startSim((Math.random() * 1e9) | 0); applyMode(); }
$('#rearrange').addEventListener('click', () => { unlock(); rearrange(); if (state.tab === 'map') renderPanel(); });
$('#aroundExit').addEventListener('click', () => { state.mode = 'sim'; applyMode(); if (state.tab) renderPanel(); });
$('#nbAround').addEventListener('click', () => { if (nowSample) arrangeAround([nowSample.key]); });
const splash = $('#splash');
$('#spGen').addEventListener('click', async () => { unlock(); splash.hidden = true; await setSamples(await dealTest(1000), true, ''); });
for (const id of ['spFolder', 'spFiles']) $('#' + id).addEventListener('change', async e => {
  unlock();
  const list = [...e.target.files].map(f => ({ file:f, path:f.webkitRelativePath || f.name })); e.target.value = '';
  if (!list.length) return;
  splash.hidden = true; await loadList(list);
  if (!state.S.length) splash.hidden = false;
});
updateAroundUI();
})();
</script>
