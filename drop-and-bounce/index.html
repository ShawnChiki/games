<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Drop &amp; Bounce</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=Rubik+Mono+One&display=swap">
<style>
/* Layout: full-bleed orthographic silo; HUD floats in the safe gutters. Signage up top, thumb zones at the bottom. */
:root{
  --lab:#E8ECF0; --panel:#FFFFFF; --ink:#18202D; --muted:#5E6A7C; --rule:#D2D8E0;
  --you:#FF6A3D; --bot:#2E7BFF; --hazard:#FFC21A; --danger:#E5213A;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--lab);color:var(--ink);font-family:var(--ui);font-size:15px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--bot);outline-offset:2px}
#stage{position:fixed;inset:0;background:radial-gradient(140% 90% at 50% 22%,#FBFCFD 0%,#EDF1F4 55%,#D9E0E7 100%)}
#stage canvas{display:block}
#touch{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 14px)}
.tap{pointer-events:auto}
#top{display:flex;align-items:center;gap:8px}
#mid{flex:1;min-width:0;display:flex;justify-content:center;overflow:hidden}
.ibtn{flex:none;width:42px;height:42px;border-radius:13px;border:1px solid var(--rule);background:rgba(255,255,255,.9);display:grid;place-items:center;padding:0}
.ibtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ibtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.ibtn[aria-pressed="true"] svg{stroke:#fff}
.plate{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border:1px solid var(--rule);border-radius:14px;padding:0 12px;height:42px;white-space:nowrap}
.plate .n{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.plate .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.plate .you{color:var(--you)} .plate .bot{color:var(--bot)}
.plate .sep{width:1px;height:20px;background:var(--rule)}
.hearts{display:flex;gap:3px}
.hearts svg{width:16px;height:16px;fill:var(--danger)}
.hearts svg.off{fill:var(--rule)}
#strip{display:flex;justify-content:center;gap:4px}
.cell{--c:var(--you);flex:0 1 30px;min-width:0;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;color:var(--c);border:2px dashed var(--c);background:rgba(255,255,255,.75);transition:transform .2s,opacity .3s}
.cell.bot{--c:var(--bot)}
.cell.placed{border-style:solid;background:var(--c);color:#fff}
.cell.gone{opacity:.25}
.cell.cur{transform:scale(1.16);box-shadow:0 0 0 3px rgba(24,32,45,.14)}
#banner{text-align:center;min-height:40px}
#banner h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0;letter-spacing:.01em;text-wrap:balance}
#banner p{margin:3px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
body.dark #banner h2{color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
body.dark #banner p{color:#D8DEE6}
#bubble{align-self:center;max-width:min(340px,100%);background:var(--panel);border:2px solid var(--bot);border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:15px;line-height:1.32;box-shadow:0 8px 20px rgba(24,32,45,.12)}
#bubble b{color:var(--bot);font-weight:700}
.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#spacer{flex:1}
#bottom{display:flex;flex-direction:column;gap:10px}
.ctl{display:flex;gap:8px}
.btn{flex:1;min-height:52px;border-radius:15px;border:1px solid var(--rule);background:rgba(255,255,255,.95);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 10px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.sm{min-height:40px;font-size:15px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.you{background:var(--you);border-color:var(--you);color:#fff;flex:1.4}
.caption{text-align:center;font-size:14px;color:var(--muted);line-height:1.3}
.caption b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--ink)}
#pads{display:flex;justify-content:space-between;align-items:flex-end}
.pad{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;align-content:center;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
#padL{border:2px dashed rgba(24,32,45,.3);background:rgba(255,255,255,.6)}
#padR{border:3px solid var(--ink);background:rgba(255,255,255,.8);color:var(--ink);font-family:var(--display);font-size:17px;letter-spacing:.02em;text-transform:none;transition:transform .08s}
#padR small{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
#padR.on{background:var(--ink);color:#fff;transform:scale(.93)}
#padR.on small{color:#CDD5DF}
#stick{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(24,32,45,.25);background:rgba(255,255,255,.3);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:var(--ink);opacity:.82}
#labHead{text-align:center;padding-top:6px}
#labName{font-family:var(--display);font-size:44px;line-height:1.05}
#labSay{color:var(--muted);font-size:15px;margin-top:4px}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:7px 13px;font-family:var(--mono);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px)}
#menu{background:linear-gradient(to bottom,rgba(232,236,240,0) 0%,rgba(232,236,240,.55) 34%,rgba(232,236,240,.96) 56%);overflow:auto}
.menuIn{width:100%;max-width:460px;margin:0 auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
#menu h1{font-family:var(--display);font-weight:400;font-size:clamp(36px,12vw,56px);line-height:.9;margin:8px 0 10px;text-wrap:balance}
#menu h1 span{color:var(--you)}
#menu h1 em{font-style:normal;color:var(--bot)}
.lede{margin:0;font-size:16px;line-height:1.4;max-width:34ch}
.modes{display:grid;gap:8px;margin-top:14px}
.mode{display:grid;grid-template-columns:1fr auto;gap:3px 10px;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:16px;padding:12px 14px}
.mode b{font-family:var(--display);font-weight:400;font-size:16px}
.mode span{grid-column:1/-1;color:var(--muted);font-size:14px;line-height:1.3}
.mode i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);align-self:center}
.mode.lead{border:2px solid var(--ink);box-shadow:0 6px 0 var(--hazard)}
.link{background:none;border:none;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:14px 0 2px;font-weight:600;font-size:15px}
#sheet,#over{position:fixed;inset:0;background:rgba(24,32,45,.38);display:flex;align-items:flex-end;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#over{align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:460px;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:88%;overflow:auto}
#over .card{border-radius:22px;padding:22px;text-align:center}
.card header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.card h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
#over h2{font-size:30px;margin:6px 0 4px}
#over p{color:var(--muted);margin:0 0 16px;line-height:1.4}
.field{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.field label{font-weight:600}
.field output{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--ink)}
.field small{grid-column:1/-1;color:var(--muted);font-size:13px}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:10px;overflow:hidden;grid-column:1/-1;justify-self:start;margin-top:4px}
.seg button{border:none;background:#fff;padding:7px 12px;font-family:var(--mono);font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.note{color:var(--muted);font-size:13px;margin:12px 0 0}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:18px 0 0;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:1px 5px;margin-left:6px;font-weight:500;vertical-align:1px}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--lab)}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.cell{transition:none}}
</style>

</head>
<body>
<div id="stage"></div>
<div id="touch"></div>

<div id="hud">
  <div id="top">
    <button class="ibtn tap" id="bMenu" aria-label="Back to menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div id="mid">
      <div class="plate" id="score" hidden aria-label="Score, you versus bot"><span class="n you" id="sP">0</span><span class="n" style="color:var(--rule)">:</span><span class="n bot" id="sB">0</span><span class="sep"></span><span class="lbl" id="sTo">to 5</span></div>
      <div class="plate" id="meter" hidden><span class="n" id="mH">0</span><span class="lbl">ft</span><span class="sep" id="mSep"></span><div class="hearts" id="mHearts"></div></div>
    </div>
    <button class="ibtn tap" id="bGear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    <button class="ibtn tap" id="bZoom" aria-label="Zoom in" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5M10.5 8v5M8 10.5h5"/></svg></button>
  </div>
  <div id="strip" hidden></div>
  <div id="banner"><h2 id="bH"></h2><p id="bP"></p></div>
  <div id="bubble" hidden></div>
  <div id="sandCtl" hidden class="ctl" style="align-self:center;width:min(300px,100%)">
      <button class="btn tap sm" id="bSClear">Clear</button>
      <button class="btn primary tap sm" id="bSDrop">Drop a piece</button>
    </div>
  <div id="labHead" hidden><div id="labName"></div><div id="labSay"></div></div>
  <div id="spacer"></div>
  <div id="bottom">
    <div id="dropCtl" hidden>
      <div class="caption" id="dropLabel"></div>
      <div class="ctl" style="margin-top:8px">
        <button class="btn tap" id="bRot"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/></svg>Turn</button>
        <button class="btn tap" id="bTip"><svg viewBox="0 0 24 24"><path d="M12 20V8M7 12l5-5 5 5"/><path d="M5 4h14"/></svg>Tip</button>
        <button class="btn tap" id="bAuto">Auto</button>
        <button class="btn you tap" id="bDrop">Drop</button>
      </div>
    </div>
    <div id="labCtl" hidden>
      <div class="chips" id="labModes">
        <button class="chip tap" data-m="blocks" aria-pressed="true">Blocks</button>
        <button class="chip tap" data-m="any" aria-pressed="false">Letters</button>
        <button class="chip tap" data-m="cross" aria-pressed="false">Cross ∩</button>
        <button class="chip tap" data-m="fuse" aria-pressed="false">Fuse ∪</button>
        <button class="chip tap" data-m="slab" aria-pressed="false">Slab</button>
      </div>
      <div class="ctl" style="margin-top:10px">
        <button class="btn tap" id="bLClear">Clear</button>
        <button class="btn tap" id="bLRoll">Reroll</button>
        <button class="btn primary tap" id="bLDrop">Drop it</button>
      </div>
    </div>
    <div id="pads" hidden>
      <div class="pad" id="padL">Drag<br>to move</div>
      <div class="pad" id="padR">JUMP<small>hold on walls</small></div>
    </div>
  </div>
</div>
<div id="stick" hidden><div id="knob"></div></div>

<div id="menu" class="screen" hidden>
  <div class="menuIn">
    <div class="eyebrow">Test chamber 07 · grain silo · Ø <span id="mDiam">18</span> ft</div>
    <h1>DROP<span>&amp;</span><em>BOUNCE</em></h1>
    <p class="lede">Take turns dropping strange shapes into the silo. Then climb the pile while it lands around you.</p>
    <div class="modes">
      <button class="mode lead tap" data-mode="duel"><b>Duel</b><i id="mTo">First to 5</i><span>You and the bot each place 3 pieces. They fall in that order while you race out the top.</span></button>
      <button class="mode tap" data-mode="endless"><b>Endless climb</b><i>Co-op</i><span>Pieces keep coming. Climb with the bot until your 3 team hearts run out.</span></button>
      <button class="mode tap" data-mode="sandbox"><b>Sandbox</b><i>Solo</i><span>Just you. Drop pieces whenever and tune how you move.</span></button>
      <button class="mode tap" data-mode="lab"><b>Shape lab</b><i>Pieces</i><span>Reroll glyph mashups and drop them to see how they settle.</span></button>
    </div>
    <div style="text-align:center"><button class="link tap" id="mTune">Settings</button></div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="card" role="dialog" aria-label="Settings">
    <header><h2>Settings</h2><button class="btn primary" id="sDone" style="flex:none;min-height:40px;padding:0 16px">Done</button></header>
    <div id="tuneBody"></div>
    <div class="ctl" style="margin-top:14px"><button class="btn" id="sReset">Defaults</button><button class="btn primary" id="sRestart">Restart with these</button></div>
  </div>
</div>

<div id="over" hidden>
  <div class="card">
    <div class="eyebrow" id="oEy"></div>
    <h2 id="oTitle"></h2>
    <p id="oSub"></p>
    <div class="ctl"><button class="btn" id="oMenu">Menu</button><button class="btn primary" id="oAgain">Play again</button></div>
  </div>
</div>

<div id="fail" hidden><p>The 3D and physics libraries didn't load. Check your connection and reload the page.</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/MarchingCubes.js"></script>

<script id="core">
// ===== Shape core: glyph outlines → convex prisms → boolean mashups (pure math, no DOM) =====
var TAU=Math.PI*2, D2R=Math.PI/180;
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var W=0.42;
function ccw(p){var a=0;for(var i=0;i<p.length;i++){var q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1];}if(a<0)p.reverse();return p;}
function stroke(x0,y0,x1,y1,w){w=w||W;var dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,e=w/2,ax=x0-ux*e,ay=y0-uy*e,bx=x1+ux*e,by=y1+uy*e,nx=-uy*e,ny=ux*e;return[ccw([[ax+nx,ay+ny],[bx+nx,by+ny],[bx-nx,by-ny],[ax-nx,ay-ny]])];}
function arc(cx,cy,r,a0,a1,res,w){w=w||W;var span=a1-a0,n=Math.max(1,Math.ceil(Math.abs(span)/res)),ri=r-w/2,ro=r+w/2,out=[];
  for(var i=0;i<n;i++){var t0=(a0+span*i/n)*D2R,t1=(a0+span*(i+1)/n)*D2R,c0=Math.cos(t0),s0=Math.sin(t0),c1=Math.cos(t1),s1=Math.sin(t1);
    if(ri<.02)out.push(ccw([[cx,cy],[cx+ro*c0,cy+ro*s0],[cx+ro*c1,cy+ro*s1]]));
    else out.push(ccw([[cx+ri*c0,cy+ri*s0],[cx+ro*c0,cy+ro*s0],[cx+ro*c1,cy+ro*s1],[cx+ri*c1,cy+ri*s1]]));}
  return out;}
function sector(cx,cy,r,a0,a1,res){var n=Math.max(2,Math.ceil((a1-a0)/res)),p=[];if(a1-a0<179)p.push([cx,cy]);for(var i=0;i<=n;i++){var t=(a0+(a1-a0)*i/n)*D2R;p.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return[ccw(p)];}
function disc(cx,cy,r,n){var p=[];for(var i=0;i<n;i++){var t=i/n*TAU;p.push([cx+r*Math.cos(t),cy+r*Math.sin(t)]);}return[ccw(p)];}
function poly(pts){return[ccw(pts.map(function(p){return p.slice();}))];}
function cat(){return[].concat.apply([],arguments);}

// Stylized glyphs from several scripts, drawn as chunky strokes in a 2×2 box.
var GLYPHS=[
 {ch:'R',say:'a chunky R',make:function(r){return cat(stroke(-.62,-1,-.62,1),stroke(-.62,.79,-.05,.79),stroke(-.62,.21,-.05,.21),arc(-.05,.5,.29,-90,90,r),stroke(-.05,.21,.62,-1));}},
 {ch:'D',say:'a D',make:function(r){return cat(stroke(-.65,-1,-.65,1),stroke(-.65,.79,-.2,.79),stroke(-.65,-.79,-.2,-.79),arc(-.2,0,.79,-90,90,r));}},
 {ch:'A',say:'an A',make:function(r){return cat(stroke(-.78,-1,0,.92),stroke(.78,-1,0,.92),stroke(-.42,-.25,.42,-.25));}},
 {ch:'△',say:'a fat triangle',make:function(r){return poly([[-1,-.85],[1,-.85],[0,.95]]);}},
 {ch:'O',say:'a ring',make:function(r){return arc(0,0,.79,0,360,r);}},
 {ch:'C',say:'a C hook',make:function(r){return arc(0,0,.79,40,320,r);}},
 {ch:'S',say:'an S',make:function(r){return cat(arc(0,.44,.42,20,270,r),arc(0,-.4,.42,-160,90,r));}},
 {ch:'K',say:'a K',make:function(r){return cat(stroke(-.6,-1,-.6,1),stroke(-.5,0,.7,1),stroke(-.35,.15,.72,-1));}},
 {ch:'U',say:'a U',make:function(r){return cat(stroke(-.62,1,-.62,-.15),stroke(.62,1,.62,-.15),arc(0,-.15,.62,180,360,r));}},
 {ch:'Y',say:'a Y',make:function(r){return cat(stroke(-.8,1,0,.05),stroke(.8,1,0,.05),stroke(0,.05,0,-1));}},
 {ch:'λ',say:'a lambda',make:function(r){return cat(stroke(-.6,1,.7,-1),stroke(.02,.05,-.72,-1));}},
 {ch:'Σ',say:'a sigma',make:function(r){return cat(stroke(-.7,.92,.75,.92),stroke(-.7,-.92,.75,-.92),stroke(-.62,.92,.12,0),stroke(.12,0,-.62,-.92));}},
 {ch:'Ω',say:'an omega',make:function(r){return cat(arc(0,.2,.6,-45,225,r),stroke(-.42,-.22,-.45,-.92),stroke(.42,-.22,.45,-.92),stroke(-.9,-.92,-.4,-.92),stroke(.4,-.92,.9,-.92));}},

    var f=document.createElement('div');f.className='field';var id='t_'+d.k;
    var lab=document.createElement('label');lab.textContent=d.label;if(!d.seg)lab.htmlFor=id;if(d.next){var tg=document.createElement('span');tg.className='tag';tg.textContent='next round';lab.appendChild(tg);}f.appendChild(lab);
    if(d.seg){var sg=document.createElement('div');sg.className='seg';d.seg.forEach(function(o){var bt=document.createElement('button');bt.textContent=o[1];bt.setAttribute('aria-pressed',S[d.k]===o[0]?'true':'false');

    else if(d.toggle){var cb=document.createElement('input');cb.type='checkbox';cb.id=id;cb.checked=!!S[d.k];cb.style.cssText='width:22px;height:22px;accent-color:var(--ink)';cb.onchange=function(){S[d.k]=cb.checked;save();};f.appendChild(cb);}
    else{var out=document.createElement('output');out.textContent=d.fmt(+S[d.k]);f.appendChild(out);var r=document.createElement('input');r.type='range';r.id=id;r.min=d.min;r.max=d.max;r.step=d.step;r.value=S[d.k];

function prePhys(dt){pieces.forEach(function(pc){pc.pvy=pc.body.velocity.y;});
  P.forEach(function(p){if(!p.alive||p.esc)return;var b=p.body,v=b.velocity;p.pv.x=v.x;p.pv.y=v.y;p.pv.z=v.z;
    p.stun-=dt;p.bonkCd-=dt;p.inv-=dt;p.jbuf-=dt;p.coyote-=dt;p.jumpCd-=dt;p.wjCd-=dt;
    if(p.jumpEdge){p.jbuf=.2;p.jumpEdge=false;}
    var g=p.g,grounded=!!g,walk=grounded&&g.ny>=Math.cos(S.slip*D2R);p.grounded=grounded;
    if(grounded){p.coyote=.18;if(walk)p.stam=Math.min(S.climb,p.stam+dt*2.5);}
    if(S.move==='pogo'){pogoStep(p,dt,g,grounded);return;}
    if(p.mantle){var mt=p.mantle;mt.t+=dt;if(b.position.y<mt.y)v.set(mt.dx*1.5,15,mt.dz*1.5);else{v.set(mt.dx*8,1.5,mt.dz*8);mt.fw+=dt;}
      if(mt.fw>.17||mt.t>.9)p.mantle=null;p.climbing=false;return;}
    var ctrl=p.stun>0?.25:1,lx=p.lean.x*ctrl,lz=p.lean.z*ctrl,sp=S.run*(1+catchup(p)*.5),tx=lx*sp,tz=lz*sp,dx,dz,acc,dl;
    if(walk&&p.jumpCd<=0){dx=tx-v.x;dz=tz-v.z;acc=90*dt;dl=Math.hypot(dx,dz);if(dl>acc){dx*=acc/dl;dz*=acc/dl;}
      var nx=v.x+dx,nz=v.z+dz,vy=-(nx*g.nx+nz*g.nz)/g.ny;v.set(nx,vy-.8,nz);}
    else{dx=tx-v.x;dz=tz-v.z;acc=34*S.air*dt*(Math.hypot(lx,lz)>.1?1:.4);dl=Math.hypot(dx,dz);if(dl>acc){dx*=acc/dl;dz*=acc/dl;}v.x+=dx;v.z+=dz;
      if(grounded&&!walk&&Math.hypot(v.x,v.z)>4&&p.slip<=0){p.slip=1;voiceWhoa(p);}}
    var jv=JUMP*S.bounce*(1+catchup(p));
    if(p.jbuf>0&&p.coyote>0&&p.jumpCd<=0){v.y=jv;if(g&&!walk){v.x+=g.nx*5;v.z+=g.nz*5;}p.jbuf=0;p.coyote=0;p.jumpCd=.18;p.jumping=true;p.land=.5;sfxJump(b.position);
      var o=g&&g.o;if(o&&o.isPiece&&!o.pc.locked){o.wakeUp();var J=-jv*b.mass*.08;o.applyImpulse(new CANNON.Vec3(0,J,0),new CANNON.Vec3(g.px,g.py,g.pz));}
      if(o&&o.isPlayer){o.velocity.y=Math.min(o.velocity.y,-8);o.pl.bonk=1;voiceOof(o.pl);}}
    else if(p.jbuf>0&&!grounded&&p.wallN&&p.wjCd<=0){var w=p.wallN;v.set(w.x*9+lx*3,jv*.95,w.z*9+lz*3);p.jbuf=0;p.wjCd=.3;p.jumping=true;p.stam=Math.max(0,p.stam-.25);voiceHup(p);sfxJump(b.position);}
    if(p.jumping&&!p.hold&&v.y>4){v.y*=.5;p.jumping=false;}if(v.y<=0)p.jumping=false;
    p.climbing=false;
    if(p.wallN){var w2=p.wallN,into=-(lx*w2.x+lz*w2.z),lm=Math.hypot(lx,lz);
      if(p.hold&&p.stam>0&&!p.jumping&&(into>.2||lm<.2)){v.y=Math.max(v.y,CLIMB*1.15);v.x=-w2.x*2.5+lx*1.5;v.z=-w2.z*2.5+lz*1.5;p.stam-=dt;p.climbing=true;p.scrT=(p.scrT||0)-dt;if(p.scrT<=0){p.scrT=.09;sfxScramble(b.position);}}
      if((into>.15||p.climbing)&&v.y>-16)tryMantle(p,-w2.x,-w2.z);}
    if(!p.mantle&&!grounded&&v.y<7){var lmm=Math.hypot(lx,lz);if(lmm>.3)tryMantle(p,lx/lmm,lz/lmm);}
    var hs=Math.hypot(v.x,v.z),MX=16;if(hs>MX){v.x*=MX/hs;v.z*=MX/hs;}});}
function pogoStep(p,dt,g,grounded){var b=p.body,v=b.velocity,ctrl=p.stun>0?.25:1,lx=p.lean.x*ctrl,lz=p.lean.z*ctrl;p.climbing=false;p.mantle=null;
  if(p.hold)p.charge=Math.min(1,p.charge+dt/.55);
  var acc=30*S.air*dt;v.x+=lx*acc;v.z+=lz*acc;if(Math.hypot(lx,lz)<.1){v.x*=1-.8*dt;v.z*=1-.8*dt;}
  if(grounded&&p.jumpCd<=0){var N=V3(g.nx,g.ny,g.nz).normalize(),slope=Math.acos(clamp(N.y,-1,1))/D2R,lean=V3(lx,0,lz),dir,power;
    if(slope>S.slip){var down=V3(0,-1,0),tg=down.clone().addScaledVector(N,-down.dot(N)).normalize();v.set(tg.x*9+N.x*7+lx*2,Math.max(5,N.y*7+tg.y*4),tg.z*9+N.z*7+lz*2);p.slip=1;p.charge*=.5;dir=N;power=7;voiceWhoa(p);sfxBoing(6,b.position.y,b.position);}
    else{power=(POGO+POGOC*p.charge)*S.bounce*(1+catchup(p));var k=Math.min(1,slope/S.slip)*.65;dir=V3(0,1-k,0).addScaledVector(N,k).addScaledVector(lean,.42).normalize();
      v.set(dir.x*power+v.x*.3,dir.y*power,dir.z*power+v.z*.3);if(p.charge>.6)voiceHup(p);sfxBoing(power,b.position.y,b.position);p.charge=0;}
    p.jumpCd=.14;p.land=1;var o=g.o;
    if(o&&o.isPiece&&!o.pc.locked){o.wakeUp();var J=-power*b.mass*.1;o.applyImpulse(new CANNON.Vec3(dir.x*J,dir.y*J,dir.z*J),new CANNON.Vec3(g.px,g.py,g.pz));}
    if(o&&o.isPlayer){o.velocity.y=Math.min(o.velocity.y,-10);o.pl.bonk=1;voiceOof(o.pl);}}
  var hs=Math.hypot(v.x,v.z),MX=Math.max(13,S.run);if(hs>MX){v.x*=MX/hs;v.z*=MX/hs;}}
function tryMantle(p,dx0,dz0){var b=p.body,pos=b.position,il=Math.hypot(dx0,dz0);if(il<.3)return false;var ix=dx0/il,iz=dz0/il;
  var fx=pos.x+ix*(PR+.6),fz=pos.z+iz*(PR+.6),top=pos.y+PR+S.reach;if(Math.hypot(fx,fz)>R-PR*.8)return false;
  var h=ray(fx,top+40,fz,fx,pos.y-PR,fz,G_PIECE);if(!h)return false;var ly=h.hitPointWorld.y;
  if(ly>top||ly<pos.y-PR*.45||h.hitNormalWorld.y<.55)return false;if(h.body&&h.body.velocity.y<-3)return false;
  p.mantle={y:ly+PR+.25,dx:ix,dz:iz,t:0,fw:0};p.stam=Math.max(0,p.stam-.1);voiceHup(p);sfxMantle(pos);return true;}
function postPhys(){
  P.forEach(function(p){p.g=null;p.top=null;p.wallN=null;p.silo=null;});
  var cs=world.contacts;
  for(var ci=0;ci<cs.length;ci++){var c=cs[ci];
    for(var k=0;k<2;k++){var p=P[k];if(!p.alive||p.esc)continue;var other,nx,ny,nz,r;
      if(c.bi===p.body){other=c.bj;nx=-c.ni.x;ny=-c.ni.y;nz=-c.ni.z;r=c.ri;}else if(c.bj===p.body){other=c.bi;nx=c.ni.x;ny=c.ni.y;nz=c.ni.z;r=c.rj;}else continue;
      var bp=p.body.position;
      if(ny>.35){if(!p.g||ny>p.g.ny)p.g={o:other,nx:nx,ny:ny,nz:nz,px:bp.x+r.x,py:bp.y+r.y,pz:bp.z+r.z};}
      else if(ny<-.45){if(other.isPiece)p.top=other;}
      else if(other.isPiece){if(!p.wallN||Math.abs(ny)<Math.abs(p.wallN.y))p.wallN={x:nx,y:ny,z:nz};}
      else if(other.isWall)p.silo={nx:nx,nz:nz};}}
  P.forEach(function(p){if(!p.alive||p.esc)return;var b=p.body,bp=b.position;
    if(!p.g&&b.velocity.y<=1){var h=ray(bp.x,bp.y,bp.z,bp.x,bp.y-PR-.22,bp.z,G_PIECE|G_STATIC|G_P[1-p.i]);if(h&&h.body!==b&&h.hitNormalWorld.y>.35){var n=h.hitNormalWorld;p.g={o:h.body,nx:n.x,ny:n.y,nz:n.z,px:h.hitPointWorld.x,py:h.hitPointWorld.y,pz:h.hitPointWorld.z};}}
    if(p.jumpCd>0)p.g=null;
    if(p.g&&!p.wasGround&&p.pv.y<-9&&S.move!=='pogo'){p.land=Math.min(1,-p.pv.y/26);sfxLand(Math.min(1,-p.pv.y/30),bp,p.g.o&&p.g.o.isPiece);var o=p.g.o;if(o&&o.isPiece&&!o.pc.locked){o.wakeUp();var J=b.mass*p.pv.y*.08;o.applyImpulse(new CANNON.Vec3(0,J,0),new CANNON.Vec3(p.g.px,p.g.py,p.g.pz));}}
    p.wasGround=!!p.g;
    if(p.top&&p.inv<=0){var t=p.top,vd=Math.max(-t.velocity.y,t.pc?-t.pc.pvy:0);
      if(vd>6||(p.g&&vd>1.2&&t.mass>2)){if(t.pc&&t.pc.radius<1.6){if(p.bonkCd<=0){p.stun=.5;p.bonk=1;p.bonkCd=.8;sfxBonk(bp);voiceOof(p);}}else{kill(p);return;}}}
    if(p.silo){var into=-(p.pv.x*p.silo.nx+p.pv.z*p.silo.nz);if(into>12&&p.bonkCd<=0){p.stun=.45;p.bonk=1;p.bonkCd=.6;sfxBonk(bp);voiceOof(p);}}
    var d=Math.hypot(bp.x,bp.z);if(d>R+.5){bp.x*=(R-1)/d;bp.z*=(R-1)/d;}
    if(bp.y<-6){if(p.inWorld){world.remove(b);p.inWorld=false;}p.alive=false;respawn(p);}});
}
var warnRings=[];
function lockPiece(pc){var b=pc.body;if(AC){stopWhistle(pc);sfxLock(b.position);}b.type=CANNON.Body.STATIC;b.mass=0;b.updateMassProperties();b.velocity.set(0,0,0);b.angularVelocity.set(0,0,0);pc.locked=true;}
function settleAndWarn(dt){var used=0;
  pieces.forEach(function(pc){var b=pc.body;if(pc.locked)return;
    var w=b.angularVelocity.length();if(w>6)b.angularVelocity.scale(6/w,b.angularVelocity);
    if(S.lock&&G.t-pc.born>.6){if(b.velocity.lengthSquared()<.5&&b.angularVelocity.lengthSquared()<.12){pc.still+=dt;if(pc.still>.45)lockPiece(pc);}else pc.still=0;}
    if(b.velocity.y<-1.5){var h=ray(b.position.x,b.position.y-pc.radius-.2,b.position.z,b.position.x,-1,b.position.z,G_PIECE|G_STATIC);
      if(h){pc.landAt=pc.landAt||new THREE.Vector3();pc.landAt.set(b.position.x,h.hitPointWorld.y,b.position.z);if(AC&&pc.wh)tickWhistle(pc,h.hitPointWorld.y);}
      if(h&&S.warn&&used<10){var r=warnRings[used];if(!r){r=new THREE.Mesh(new THREE.RingGeometry(.82,1,48),new THREE.MeshBasicMaterial({color:lin(0xE5213A),transparent:true,depthWrite:false,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.renderOrder=5;scene.add(r);warnRings.push(r);}
        var sc=Math.max(.8,pc.rxz*.85);r.position.set(b.position.x,h.hitPointWorld.y+.08,b.position.z);r.scale.set(sc,sc,1);r.visible=true;r.material.opacity=.45+.35*Math.sin(G.t*14);used++;}}});
  for(var i=used;i<warnRings.length;i++)warnRings[i].visible=false;
  P.forEach(function(p){if(!p.alive||p.grounded)return;var bp=p.body.position,h2=ray(bp.x,bp.y-PR,bp.z,bp.x,bp.y-40,bp.z,G_PIECE|G_STATIC);if(h2){p.landAt=p.landAt||new THREE.Vector3();p.landAt.copy(h2.hitPointWorld);}});
  MZ.inten+=((Math.min(1,fallingPieces().length*.4+(G.overtime?.8:0)+(G.mode==='endless'?.3:0)))-MZ.inten)*Math.min(1,dt*.8);}
function fallingPieces(){return pieces.filter(function(pc){return !pc.locked&&pc.body.velocity.y<-2;});}
function interestFor(p){var bp=p.body.position,best=null,bd=1e9;pieces.forEach(function(pc){if(pc.locked)return;var b=pc.body,sp=b.velocity.length();if(sp<1.5)return;

function modeLogic(dt){var m=G.mode;
  if(m==='duel'){
    if(G.phase==='drop'&&G.cur&&(G.cur.owner==='b'||G.autoMine)&&!G.cur.done){G.botT-=dt;if(G.botT<=0)botPlace();}
    if(G.phase==='ready'){G.readyT-=dt;var cn=Math.ceil(G.readyT/.7);if(cn!==G.cnt&&cn>0&&cn<=3){G.cnt=cn;banner(String(cn),'First one out the top scores');sfxBeep(false);}if(G.readyT<=0){G.phase='bounce';banner('GO!','');sfxBeep(true);}}
    if(G.phase==='bounce'){
      if(G.dropIdx<G.n){G.dropT-=dt;if(G.dropT<=0){var o=G.order[G.dropIdx];spawnPiece(o.data,o.owner,o.x,spawnYOf(o.data),o.z,o.q);G.dropIdx++;G.dropT=S.gap;renderStrip();}
        if(G.dropIdx<G.n){var nx=G.order[G.dropIdx];banner('NEXT: #'+(G.dropIdx+1)+(nx.owner==='p'?' · YOURS':' · BOT’S'),'in '+Math.max(0,G.dropT).toFixed(1)+' s');}}
      if(G.dropIdx>=G.n){G.otT+=dt;if(!G.overtime){banner('ALL '+G.n+' ARE DOWN','Get out the top');if(G.otT>12){G.overtime=true;G.dropT=0;sfxSiren();}}
        if(G.overtime){G.dropT-=dt;banner('OVERTIME','Extra pieces until someone gets out');if(G.dropT<=0){dropRandom('n',EXIT+3);G.dropT=3.5;}}}
      P.forEach(function(p){if(p.alive&&!p.esc&&p.body.position.y-1>EXIT)roundEnd(p.i);});}}
  else if(m==='endless'&&G.phase==='bounce'){
    G.dropT-=dt;var alive=P.filter(function(p){return p.alive;}),hi=0,lo=1e9;alive.forEach(function(p){var f=p.body.position.y-PR;hi=Math.max(hi,f);lo=Math.min(lo,f);});
    if(!alive.length){lo=G.lastLo||0;hi=G.lastHi||0;}G.lastLo=lo;G.lastHi=hi;G.best=Math.max(G.best,hi);$('#mH').textContent=Math.round(Math.max(0,hi));
    if(G.dropT<=0){G.dropT=Math.max(1.6,S.gap*.9);dropRandom(G.flip++%2?'b':'p',hi+30);}
    ensureWalls(lo-30,hi+80);
    pieces.slice().forEach(function(pc){var b=pc.body,top=b.position.y+pc.radius;if(top<lo-90)removePiece(pc);else if(top<lo-28&&!pc.locked)lockPiece(pc);});
    if(wallMesh){var base=Math.max(0,Math.floor((CAM.ty-110)/8)*8);wallMesh.position.y=base+wallH/2;}}
  else if(m==='sandbox'){var p0=P[0];if(p0.alive){$('#mH').textContent=Math.round(Math.max(0,p0.body.position.y-PR));
      if(!p0.esc&&p0.body.position.y-1>EXIT){sfxWin();var b=p0.body.position;floatText('OUT!',p0.css,b.x,b.y+2.5,b.z);burst(b.x,b.y,b.z,50,[lin(0xFF6A3D),lin(0xFFC21A),lin(0xffffff)],15,14,0,.3);
        startEscape(p0,function(){if(G.mode==='sandbox'){var s=findRespawn();placePlayer(p0,s.x,s.y,s.z);sfxRespawn(p0.body.position);}});}}}
  else if(m==='menu'){G.dropT-=dt;if(G.phase==='demo'&&G.dropT<=0){G.dropT=2.6;dropRandom(G.flip++%2?'b':'p',EXIT+3);}
    if(G.phase==='demo'){var outP=P.filter(function(p){return p.alive&&!p.esc&&p.body.position.y-1>EXIT;});outP.forEach(function(p){startEscape(p);});if(outP.length||pieces.length>13){G.phase='demoEnd';later(outP.length?4.7:1.6,demoReset);}}
    CAM.azT+=dt*.07;}
  else if(m==='lab'&&G.prev){G.prev.rotation.y+=dt*.55;G.prev.rotation.x=Math.sin(G.t*.4)*.25;G.prev.position.y=EXIT*.6+Math.sin(G.t*1.3)*.4;}
  P.forEach(function(p){if(G.phase==='bounce'||G.phase==='ready')watchStuck(p,dt);});
  // respawns
  if(G.phase!=='over'&&G.phase!=='end'&&G.phase!=='drop')P.forEach(function(p){if(!p.active||p.alive)return;p.deadT+=dt;p.respawnT-=dt;
    if(p.respawnT<=0&&!(G.mode==='endless'&&G.hearts<=0))respawn(p);});}

var _tq=new THREE.Quaternion(),_ta=new THREE.Vector3(),_head=new THREE.Vector3(),_tgt=new THREE.Vector3();
function animPlayer(p,dt){var ch=p.ch;
  if(p.esc){if(!stepEscape(p,dt))return;}else{ch.root.rotation.y=0;ch.wings.visible=false;}
  if(!p.alive){if(p.dieAt&&p.deadT<.36){ch.root.visible=true;ch.root.position.set(p.dieAt.x+(Math.random()-.5)*.6,p.dieAt.y+(Math.random()-.5)*.3,p.dieAt.z+(Math.random()-.5)*.6);
      var f=Math.random();ch.root.scale.set(1.2+f*.5,.35+Math.random()*.4,1.2+f*.3);ch.root.visible=Math.random()>.2;}else{ch.root.visible=false;ch.root.scale.set(1,1,1);}return;}
  var b=p.body;ch.root.position.set(b.position.x,b.position.y,b.position.z);ch.root.scale.set(1,1,1);
  var lm=Math.hypot(p.lean.x,p.lean.z),o=P[1-p.i],faceEach=(G.phase==='end'||G.phase==='ready')&&o.alive,hv=Math.hypot(b.velocity.x,b.velocity.z),gr=p.grounded,cl=p.climbing||!!p.mantle;
  var blendA=function(a1,a2,t){return a1+wrapA(a2-a1)*t;};if(lm>.25){p.moveFace=Math.atan2(p.lean.x,p.lean.z);p.idleT=0;}else p.idleT=(p.idleT||0)+dt;
  if(faceEach)p.facingT=blendA(Math.atan2(o.body.position.x-b.position.x,o.body.position.z-b.position.z),CAM.az,.45);else if(p.climbing&&p.wallN)p.facingT=Math.atan2(-p.wallN.x,-p.wallN.z);else if(p.mantle)p.facingT=Math.atan2(p.mantle.dx,p.mantle.dz);else if(lm>.25)p.facingT=p.moveFace;else if(p.idleT>.5)p.facingT=blendA(p.moveFace||0,CAM.az,.6);
  p.facing+=wrapA(p.facingT-p.facing)*(1-Math.exp(-dt*8));ch.yaw.rotation.y=p.facing;
  p.land=Math.max(0,p.land-dt*5);p.bonk=Math.max(0,p.bonk-dt*2.4);p.slip=Math.max(0,p.slip-dt*1.6);
  var ang=Math.min(1,lm)*(S.move==='pogo'?.36:.16)+(p.slip>0?Math.sin(G.t*28)*.3*p.slip:0);_ta.set(p.lean.z,0,-p.lean.x);if(_ta.lengthSq()<1e-6)_ta.set(1,0,0);_ta.normalize();
  _tq.setFromAxisAngle(_ta,ang);ch.tilt.quaternion.slerp(_tq,1-Math.exp(-dt*10));
  var pg=S.move==='pogo';
  var st=clamp(b.velocity.y*.012,-.15,.2),sy=1+st-.2*p.land,sx=1/Math.sqrt(sy);ch.blob.scale.set(sx,sy,sx*(1-.3*p.bonk));
  if(pg)ch.spring.scale.y=1-.5*p.charge-.25*p.land;
  poseRig(p,dt,hv);
  ch.root.visible=(p.inv>0&&p.inv<5)?(Math.floor(G.t*12)%2===0):true;
  var talking=G.t<(p.talkEnd||0)?.3+.7*Math.abs(Math.sin(G.t*24+p.i*1.7))*(.6+.4*Math.sin(G.t*7.3)):0;p.mouthO=lerp(p.mouthO||0,talking,1-Math.exp(-dt*30));
  ch.mouth.scale.set(.15-.03*p.mouthO,.035+.17*p.mouthO,.07);
  // eyes: look at your partner, blink, glance at falling blocks or where they'll land, look away, blink, look back
  var e=p.eye,prevKind=e.kind;e.t-=dt;e.blink-=dt;
  if(e.t<=0){if(e.mode==='look'){e.mode='away';e.t=.7+Math.random()*.8;var a=Math.random()*TAU;e.away.set(Math.cos(a),.2+Math.random()*.8,Math.sin(a));}
    else{e.mode='look';e.t=1.6+Math.random()*1.8;e.stuff=Math.random()<(fallingPieces().length?.7:.3);}}
  if(Math.random()<dt*.15)e.blink=Math.max(e.blink,.13);
  _head.set(b.position.x,b.position.y+.3,b.position.z);var pup=1,danger=dangerPiece(p),kind,partnerOk=o.active&&o.alive;
  if(faceEach&&partnerOk){kind='partner';_tgt.set(o.body.position.x,o.body.position.y+.3,o.body.position.z);}
  else if(p.esc){kind='viewer';_tgt.copy(cam.position);}
  else if(danger){kind='danger';_tgt.set(danger.x,danger.y,danger.z);pup=.7;voiceEek(p);}
  else if(!gr&&!cl&&b.velocity.y<-6&&p.landAt){kind='land';_tgt.copy(p.landAt);}
  else if(e.mode==='look'){var it=e.stuff?interestFor(p):null;
    if(it){kind='stuff';_tgt.copy(it);}
    else if(partnerOk){kind='partner';_tgt.set(o.body.position.x,o.body.position.y+.3,o.body.position.z);}
    else if(o.active&&o.dieAt&&o.deadT<2.5){kind='splat';_tgt.copy(o.dieAt);}
    else{kind='viewer';_tgt.copy(cam.position);}}
  else{kind='away';_tgt.copy(_head).addScaledVector(e.away,8);}
  if(kind!==prevKind){e.kind=kind;if(kind!=='danger')e.blink=Math.max(e.blink,.12);}
  // cute chatter when they catch each other's eye
  if(kind==='partner'&&o.eye.kind==='partner'&&G.phase!=='end'&&Math.random()<dt*.06&&AC){voiceAsk(p);var oo=o;later(.38,function(){if(oo.alive)voiceAnswer(oo);});}
  var hdx=_tgt.x-_head.x,hdz=_tgt.z-_head.z,want=clamp(wrapA(Math.atan2(hdx,hdz)-p.facing),-1.3,1.3),pitch=clamp(Math.atan2(_tgt.y-_head.y,Math.hypot(hdx,hdz)+.01),-.5,.6);
  if(kind==='viewer'){want=clamp(wrapA(CAM.az-p.facing),-1.3,1.3);pitch=.3;}else want=clamp(want+wrapA(CAM.az-p.facing-want)*.3,-1.3,1.3);
  p.headYaw+=(want-p.headYaw)*(1-Math.exp(-dt*7));p.headPitch=(p.headPitch||0)+(pitch-(p.headPitch||0))*(1-Math.exp(-dt*6));
  ch.head.rotation.y=p.headYaw;ch.head.rotation.x=-p.headPitch*.6;
  // footsteps on the walk cycle
  if(gr&&hv>1.5&&!cl&&S.move!=='pogo'){var sgn=Math.sin(p.walkPh)>0;if(sgn!==p.stepSgn){p.stepSgn=sgn;sfxStep(b.position,p.g&&p.g.o&&p.g.o.isPiece);}}
  ch.root.updateMatrixWorld(true);aimEyes(ch,_tgt,80,e.blink>0?1:p.bonk>.5?.6:(p.esc&&p.escPh>=1)?.45:kind==='danger'?-.5:0,pup);}

function updateCam(dt){var asp=innerWidth/innerHeight,m=G.mode,el=S.camEl*D2R,w=S.diam*S.viewW,ty,tx=0,tz=0,low=.27;
  var alive=P.filter(function(p){return p.alive;});
  var focus=0;if(alive.length){if(m==='endless')focus=Math.max.apply(null,alive.map(function(p){return p.body.position.y;}));else focus=alive.reduce(function(s,p){return s+p.body.position.y;},0)/alive.length;}
  if(m==='duel'&&G.phase==='drop'){el=56*D2R;w=S.diam*1.35;low=.05;}
  else if(m==='lab'){el=26*D2R;w=S.diam*1.25;low=.12;}
  else if(m==='menu'){el=26*D2R;w=S.diam*1.3;low=.05;}
  else if(S.zoom&&alive.length){w=S.diam*.55;var hp=P[0].alive&&P[0].active?P[0]:alive[0];tx=hp.body.position.x*.85;tz=hp.body.position.z*.85;focus=hp.body.position.y;}
  var flyer=P.filter(function(q){return q.esc&&q.escPh>=1;})[0];if(flyer){var fp=flyer.body.position;focus=fp.y;tx=fp.x*.7;tz=fp.z*.7;w=Math.min(w,S.diam*.8);}
  var h=w/asp,tyMin=(h/2-h*low-1-R*Math.sin(el))/Math.cos(el);
  if(m==='duel'&&G.phase==='drop')ty=Math.max(EXIT*.62,tyMin*.6);else if(m==='lab'||m==='menu')ty=Math.max(tyMin,EXIT*.45);else ty=Math.max(tyMin,focus+2);
  var k=1-Math.exp(-dt*5);CAM.az+=wrapA(CAM.azT-CAM.az)*(1-Math.exp(-dt*7));CAM.el=lerp(CAM.el,el,k);CAM.w=lerp(CAM.w,w,k);CAM.tx=lerp(CAM.tx,tx,k);CAM.tz=lerp(CAM.tz,tz,k);CAM.ty=lerp(CAM.ty,ty,1-Math.exp(-dt*(flyer?7:3.5)));
  var W2=CAM.w,H2=W2/asp;cam.left=-W2/2;cam.right=W2/2;cam.top=H2/2;cam.bottom=-H2/2;cam.updateProjectionMatrix();
  CAM.shake=Math.max(0,CAM.shake-dt*2.5);var sh=CAM.shake*.35;
  var ce=Math.cos(CAM.el),D=400;cam.position.set(CAM.tx+Math.sin(CAM.az)*ce*D+(Math.random()-.5)*sh,CAM.ty+Math.sin(CAM.el)*D+(Math.random()-.5)*sh,CAM.tz+Math.cos(CAM.az)*ce*D);
  cam.lookAt(CAM.tx,CAM.ty,CAM.tz);
  sun.position.set(CAM.tx-10,CAM.ty+70,CAM.tz+16);sun.target.position.set(CAM.tx,CAM.ty-6,CAM.tz);var sc=sun.shadow.camera,ext=R+7;
  if(sc.right!==ext){sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.near=1;sc.far=260;sc.updateProjectionMatrix();}
  updateLabels(CAM.ty-60,CAM.ty+60);}

function update(dt){if(!$('#sheet').hidden)return;GRAV=S.grav;if(world)world.gravity.set(0,-GRAV,0);G.t+=dt;runTimers();if(IN.keys.KeyQ){CAM.azT+=dt*1.8;}if(IN.keys.KeyE){CAM.azT-=dt*1.8;}
  if(world){
    P.forEach(function(p){if(!p.active||!p.alive||p.esc)return;if(p.isBot){p.aiT-=dt;if(p.aiT<=0){aiThink(p);p.aiT=skill().think*(.7+Math.random()*.6);}aiSteer(p,dt);}
      else if(playing())humanInput(p);else{p.lean.x=p.lean.z=0;p.hold=false;}
      if(G.phase==='end'){p.lean.x=p.lean.z=0;p.hold=false;}});
    modeLogic(dt);
    prePhys(dt);world.step(1/60,dt,4);postPhys();
    settleAndWarn(dt);
    pieces.forEach(function(pc){var b=pc.body;pc.mesh.position.set(b.position.x,b.position.y,b.position.z);pc.mesh.quaternion.set(b.quaternion.x,b.quaternion.y,b.quaternion.z,b.quaternion.w);
      if(b.position.y<-30)removePiece(pc);});}
  P.forEach(function(p){animPlayer(p,dt);});
  updateParts(dt);updateFloaters(dt);updateCam(dt);}

var last=performance.now();
